[package]
name = "tfmx-web"
description = "Browser playback core for tfmx: plain-Rust core plus a wasm boundary"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# cdylib: build-wasm.sh needs a linked `.wasm` for wasm-bindgen to process
# (step 9.2). rlib: keeps plain host `cargo test -p tfmx-web` working.
crate-type = ["cdylib", "rlib"]

[dependencies]
tfmx = { path = "../tfmx" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
