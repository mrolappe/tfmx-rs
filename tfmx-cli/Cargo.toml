[package]
name = "tfmx-cli"
description = "Command line front end for the tfmx library: render modules to WAV, inspect them"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tfmx = { path = "../tfmx" }
tfmx-analysis = { path = "../tfmx-analysis", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = { version = "0.5.3", default-features = false, features = ["std", "alloc"] }

[dev-dependencies]
sha2 = "0.10"
