[package]
name = "tfmx-web-gui"
description = "Local browser GUI for TFMX tooling: a thin HTTP server over tfmx-analysis"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tfmx = { path = "../tfmx" }
tfmx-analysis = { path = "../tfmx-analysis", features = ["serde"] }
tfmx-cli = { path = "../tfmx-cli" }
tiny_http = "0.12"
serde_json = "1"
hound = "3"
